<body class="body" data-page-type="404">
  <div class="noise"></div>
  <div class="overlay"></div>
  <div class="terminal">
    <h1>Error <span class="errorcode">404</span></h1> <br />
    <p class="output">Your clearance level isn't high enough to access this nonexistent file.</p> <br />
    <p class="output">The agency advices you to <a href="/">return to the homepage</a>.</p> <br />
    <p class="output">Good luck.</p>
  </div>
  <!-- Switch for background image -->
  <div class="form-check form-switch position-fixed bottom-0 end-0 p-3">
    <input class="form-check-input backgroundswitch" type="checkbox" id="backgroundSwitch" color="pink" checked>
  </div>
  <!-- Custom Scripts -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="text/javascript" src="assets/js/terminal-viewer.js"></script>
  <script type="text/javascript" src="assets/js/404.js"></script>
  <script type="text/javascript" src="assets/js/background-toggle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const backgroundSwitch = document.getElementById('backgroundSwitch');
      const isChecked = localStorage.getItem('backgroundSwitch') !== 'false'; // Default to true
      backgroundSwitch.checked = isChecked;

      backgroundSwitch.addEventListener('change', function() {
        localStorage.setItem('backgroundSwitch', backgroundSwitch.checked);
      });
    });
  </script>
